name: Trading bot

on:
  schedule:
    # Every 15 minutes, 13:00-20:45 UTC on weekdays. That covers 9:30-16:00 ET in both
    # summer (EDT) and winter (EST); the bot exits immediately when the market is closed
    # (pre-open, after close, holidays). In daily mode the extra runs are harmless: a
    # crossover is only acted on once.
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python trading_bot.py

      - name: Save log and account state to repository
        if: always()
        run: |
          for path in logs state; do [ -e "$path" ] && git add "$path"; done
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trading bot run $(TZ=America/New_York date '+%F %H:%M') ET"
          git pull --rebase
          git push
